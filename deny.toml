# License policy (build plan, section 3.2).
# Allowed licenses only. Anything not listed: ask the owner first.
# GPL-*, AGPL-*, LGPL-* are never allowed (absence from `allow` denies them).

[graph]
# Only check what ships: macOS is the only supported target today.
# (Linux builds in CI containers are for development checks only.)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    # Approved by the owner on 2026-11-23 (see THIRD_PARTY.md):
    # nucleo-matcher, option-ext (ship) and cbindgen (build tool).
    "MPL-2.0",
    # webpki-root-certs (build tool of ghostty-vt-sys).
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
