[workspace]
resolver = "2"
members = ["crates/anveg_core", "crates/anveg_term", "crates/anveg_app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anveg_core = { path = "crates/anveg_core" }
anveg_term = { path = "crates/anveg_term" }

# UI. gpui-kit re-exports GPUI (the `gpui-pre` snapshot it pins exactly),
# gpui-base and Longbridge's gpui-component. gpui-cn's terminal (libghostty-vt)
# requires gpui-kit 0.8.x, so both are pinned exactly. See docs/PROGRESS.md.
gpui-kit = { version = "=0.8.1", default-features = false, features = ["assets"] }
gpui-cn = { version = "=0.9.0", default-features = false }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
shell-words = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
