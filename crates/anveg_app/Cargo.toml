[package]
name = "anveg_app"
description = "Anveg Code: a lightweight desktop app for managing Claude Code sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "anveg-code"
path = "src/main.rs"

[dependencies]
anveg_core.workspace = true
anveg_term.workspace = true
anveg_lsp.workspace = true
serde_json.workspace = true
trash.workspace = true
anyhow.workspace = true
gpui-kit.workspace = true
gpui-cn = { workspace = true, features = ["ghostty"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
futures.workspace = true
uuid.workspace = true
shell-words.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSBundle", "NSString", "NSError", "NSUserDefaults", "NSNotification", "NSOperation", "block2"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-user-notifications = { workspace = true, features = ["block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger"] }
block2.workspace = true

[lints]
workspace = true
